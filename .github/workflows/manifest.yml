# The Manifest kept in plugin/ is what the program prints: built natively and asked, at every change.
name: manifest

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the Manifest kept is the Manifest printed
        working-directory: plugin
        run: |
          cargo build --release
          target/release/calendar --manifest | diff -u com.yoke.calendar.yaml -
      # The servers and online-accounts are answered by the tests themselves.
      - name: the tests
        working-directory: plugin
        run: cargo test
