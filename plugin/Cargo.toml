[package]
name = "calendar"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "calendar"
path = "src/lib.rs"

[[bin]]
name = "calendar"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rrule = "0.14"
quick-xml = "0.37"
yoke-proto = "=0.7.0"
yoke-sdk = "=0.10.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

# A Plugin is a program of its own, never a member of a workspace around it.
[workspace]
